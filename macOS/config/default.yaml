# Rescue defaults (S8)
#
# Conservative on purpose. Every knob below is checked by
# ``src.utils.validators.validate_rescue_safety``; a stock checkout of
# this file MUST pass that check with no warnings. Operators who knowingly
# want a hotter profile can override per-deploy — do not loosen the on-disk
# default and call it a hotfix.
#
# Migration note (S8 vs S7):
#   * ``risk.risk_per_trade`` 0.35 -> 0.02   (rescue cap is 0.05)
#   * ``risk.daily_loss_limit_enabled`` false -> true
#   * ``risk.max_open_positions`` 10 -> 3
#   * ``risk.confidence_threshold`` 25 -> 55
#   * ``risk.stop_loss_pct`` 0.04 -> 0.025
#   * ``risk.take_profit_pct`` 0.10 -> 0.05
#   * ``risk.trailing_stop_pct`` 0.03 -> 0.02
#   * ``risk.trailing_stop_activation_pct`` 0.04 -> 0.03
#   * ``risk.break_even_trigger_pct`` 0.025 -> 0.02
#   * ``market_type`` futures -> spot           (live futures needs explicit opt-in)
#   * ``no_trade.min_confidence`` 30 -> 40
#   * ``dashboard_fallback_enabled`` (unset, defaulted True) -> false
#                                                explicit so the dashboard
#                                                surfaces real staleness
#                                                instead of replaying stale
#                                                fallback data.
#   * ``leverage.enabled`` true -> false        (rescue: no autoleverage)
active_symbol_path: runtime/active_symbol.txt
auto_scan_enabled: false
auto_select_enabled: false
candle_limit: 300
consensus:
  buy_threshold: 0.4
  conflict_ratio_threshold: 0.6
  min_active_signals: 4
  sell_threshold: -0.4
  strong_buy_threshold: 1.2
  strong_sell_threshold: -1.2
cooldown:
  min_candles_between_trades: 3
  reentry_cooldown_seconds: 180
  trade_cooldown_seconds: 60
dashboard_fallback_enabled: false
indicator_thresholds:
  adx_di:
    period: 14
    strong_trend: 25
    weak_trend: 15
  atr:
    high_volatility_multiplier: 2.0
    period: 14
  bollinger:
    period: 20
    squeeze_threshold: 0.02
    std_dev: 2.0
  cci:
    buy: -100
    period: 20
    sell: 100
    strong_buy: -200
    strong_sell: 200
  ema_cross:
    long_period: 21
    short_period: 9
    strong_divergence_pct: 0.02
  ichimoku:
    kijun_period: 26
    senkou_b_period: 52
    tenkan_period: 9
  macd:
    fast_period: 12
    signal_period: 9
    slow_period: 26
    strong_histogram_threshold: 0.5
  mfi:
    buy: 30
    period: 14
    sell: 70
    strong_buy: 20
    strong_sell: 80
  obv:
    divergence_lookback: 10
    sma_period: 20
  psar:
    af_increment: 0.02
    af_max: 0.2
    af_start: 0.02
  roc:
    period: 12
    strong_threshold: 5.0
    weak_threshold: 1.0
  rsi:
    buy: 35
    period: 14
    sell: 65
    strong_buy: 25
    strong_sell: 80
  sma_cross:
    long_period: 50
    short_period: 10
    strong_divergence_pct: 0.02
  stochastic:
    d_period: 3
    k_period: 14
    overbought: 80
    oversold: 20
  williams_r:
    overbought: -20
    oversold: -80
    period: 14
indicator_weights:
  adx_di: 1.5
  atr_filter: 0.0
  bollinger: 1.5
  cci: 1.0
  ema_cross: 1.8
  ichimoku: 2.0
  macd: 2.0
  mfi: 1.2
  obv: 1.2
  psar: 1.3
  roc: 1.0
  rsi: 1.5
  sma_cross: 1.8
  stochastic: 1.2
  williams_r: 1.0
leverage:
  enabled: false
  min_leverage: 2
  scale_ratio: 0.8
log_path: runtime/bot.log
market_type: spot
mode: paper
no_trade:
  adx_min: 15.0
  atr_high_percentile: 95.0
  min_confidence: 40.0
paper:
  fee_pct: 0.001
  starting_balance: 10000.0
polling_interval_seconds: 1
risk:
  break_even_trigger_pct: 0.02
  confidence_threshold: 55
  daily_loss_limit_enabled: true
  daily_loss_limit_pct: 0.05
  max_open_positions: 3
  max_risk_level: MEDIUM
  risk_per_trade: 0.02
  stop_loss_pct: 0.025
  take_profit_pct: 0.05
  trailing_stop_activation_pct: 0.03
  trailing_stop_pct: 0.02
state_path: runtime/state.json
timeframe: 4h
trading_mode: long_term
