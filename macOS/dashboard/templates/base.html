<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot V1{% block title_extra %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Trading Bot V1</div>
        <div class="nav-links">
            <a href="/" class="{% if page == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/scan" class="{% if page == 'scan' %}active{% endif %}">Scanner</a>
            <a href="/positions" class="{% if page == 'positions' %}active{% endif %}">Positions</a>
            <a href="/signals" class="{% if page == 'signals' %}active{% endif %}">Signals</a>
            <a href="/performance" class="{% if page == 'performance' %}active{% endif %}">Performance</a>
            <a href="/logs" class="{% if page == 'logs' %}active{% endif %}">Logs</a>
            <a href="/settings" class="{% if page == 'settings' %}active{% endif %}">Settings</a>
        </div>
        <div class="nav-status">
            <span id="auto-scan-banner" class="auto-scan-banner" style="display:none">
                <span class="auto-scan-pulse"></span>
                <span id="auto-scan-pct" class="auto-scan-pct">0%</span>
                <span class="auto-scan-bar-wrap">
                    <span id="auto-scan-bar" class="auto-scan-bar" style="width:0%"></span>
                </span>
            </span>
            <span id="auto-refresh-label">Refresh: <strong id="refresh-countdown">5</strong>s</span>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <span>Trading Bot V1</span>
        <span>Settings: <a href="/settings" style="color:var(--accent)">Settings</a></span>
    </footer>

    {% if page != 'settings' %}
    <script src="/static/app.js?v=7"></script>
    {% endif %}
</body>
</html>
