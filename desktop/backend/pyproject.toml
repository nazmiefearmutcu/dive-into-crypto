[project]
name = "diveintocrypto-desktop"
version = "0.3.0"
description = "Dive Into Crypto — Desktop Edition backend (Crocodile-fed scanner service)"
requires-python = ">=3.12"
# crocodile (the successor of Crypcodile: its crypto engine now lives under
# `crocodile.crypto`) is pinned to an exact upstream commit via a PEP 508 direct
# reference (git URL). This resolves the same for uv AND pip — it never falls
# through to the public PyPI index, where the `crocodile` name belongs to an
# UNRELATED project (dependency-confusion vector). Bump the @<sha> to upgrade. For
# active Crocodile co-development, temporarily override with a local editable
# source via `[tool.uv.sources]`.
dependencies = [
  "crocodile @ git+https://github.com/nazmiefearmutcu/Crocodile.git@5600c872c1d7a99dfe1870629dfb92d7e09da938",
  "pandas>=2.1",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "aiohttp>=3.9",
  "aiolimiter>=1.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.scripts]
dive-desktop = "diveintocrypto_desktop.__main__:main"

[dependency-groups]
# websockets is imported directly by the root e2e suite (tests/conftest.py);
# pytest-asyncio drives its `@pytest.mark.asyncio` tests. Both are explicit dev
# dependencies rather than transitive ones.
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "httpx>=0.27", "websockets>=12"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the live Binance API (network-gated)"]
# The default suite is offline (CI runners are geo-blocked by Binance with HTTP
# 451); opt in with `uv run pytest -m live -q` from a network that can reach it.
addopts = "-m 'not live'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Permit the pinned git direct reference for `crocodile` (see dependencies note).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/diveintocrypto_desktop"]
