name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "Backend (pytest: engine suite + root E2E suite)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "uv"
          cache-dependency-path: desktop/backend/uv.lock

      - name: Backend engine suite (desktop/backend)
        working-directory: desktop/backend
        run: |
          uv sync
          uv run pytest -q

      - name: Root E2E suite (tests/)
        run: uv run --project desktop/backend pytest tests/ -q

  ui:
    name: UI (npm test + build, dist drift gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install, test, build
        working-directory: desktop/ui
        run: |
          npm ci
          npm test
          node build.mjs

      - name: Assert committed dist/ matches a fresh build
        run: git diff --exit-code -- desktop/ui/dist

      - name: Explain dist drift
        if: failure()
        run: |
          echo "::error::desktop/ui/dist does not match a fresh build."
          echo "::error::dist/ is committed on purpose: the backend serves it directly"
          echo "::error::(api/app.py -> _UI_DIST), so it is a runtime artefact, not a build leftover."
          echo "::error::Fix: cd desktop/ui && node build.mjs, then commit the updated dist/ files."

  android:
    name: Android (gradle test + debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests + assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:test :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dive-into-crypto-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
