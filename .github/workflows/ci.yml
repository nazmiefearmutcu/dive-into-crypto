name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "Backend (pytest: engine suite + root E2E suite)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: desktop/backend/uv.lock

      - name: Install Python 3.12 (uv-managed)
        run: uv python install 3.12

      # --locked: test exactly the committed uv.lock; a drifted pyproject.toml fails
      # the job instead of silently re-resolving the dependency set.
      - name: Backend engine suite (desktop/backend)
        working-directory: desktop/backend
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Root E2E suite (tests/)
        run: uv run --project desktop/backend pytest tests/ -q

  ui:
    name: UI (npm test + build, dist drift gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install, test, build
        working-directory: desktop/ui
        run: |
          npm ci
          npm test
          node build.mjs

      # Tracked changes (git diff) AND new files that were never committed
      # (git status --porcelain, which lists untracked files) both count as drift.
      - name: Assert committed dist/ matches a fresh build
        run: |
          git diff --exit-code -- desktop/ui/dist
          if [ -n "$(git status --porcelain --untracked-files=all -- desktop/ui/dist)" ]; then
            git status --short --untracked-files=all -- desktop/ui/dist
            echo "::error::desktop/ui/dist contains files that are not committed."
            exit 1
          fi

      - name: Explain dist drift
        if: failure()
        run: |
          echo "::error::desktop/ui/dist does not match a fresh build."
          echo "::error::dist/ is committed on purpose: the backend serves it directly"
          echo "::error::(api/app.py -> _UI_DIST), so it is a runtime artefact, not a build leftover."
          echo "::error::Fix: cd desktop/ui && node build.mjs, then commit the updated dist/ files."

  android:
    name: Android (unit tests, lint, debug APK, release bundle smoke build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle wrapper + dependency cache (keeps Android job well under timeout).
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # The release bundle is built UNSIGNED here on purpose: -PallowUnsignedRelease=true
      # is the explicit opt-out for this smoke build. It proves R8, resource shrinking
      # and the bundle packaging still compile on every PR; the signed artifacts come
      # only from the release workflow.
      - name: Unit tests, lint, debug APK, release bundle (unsigned smoke build)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:test :app:lintDebug :app:lintVitalRelease :app:assembleDebug :app:bundleRelease -PallowUnsignedRelease=true --console=plain --parallel

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dive-into-crypto-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
